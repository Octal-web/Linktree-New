pre-commit:
    commands:
        format:
            glob: '*.{js,jsx,mjs,ts,tsx,css,json,md}'
            run: npx prettier --write {staged_files}
            stage_fixed: true

        pint:
            glob: '*.php'
            run: npm run pint -- {staged_files}
            stage_fixed: true

pre-push:
    commands:
        lint:
            glob: '*.{js,jsx,mjs,ts,tsx}'
            run: npm run lint
